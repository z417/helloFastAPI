[project]
name = "helloFastApi"
version = "1.0.0"
description = "A demo for fastapi"
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.50",
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.48.0",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.30",
    "passlib>=1.7.4",
    "cacheout>=0.16.0",
    "bcrypt>=5.0.0",
    "pydantic[email]>=2.13.4",
    "aiosqlite>=0.22.1",
    "asyncmy>=0.2.11",
    "asyncpg>=0.31.0",
    "loguru>=0.7.3",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.15",
]

[tool.ruff]
line-length = 160
exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
]


[tool.pytest.ini_options]
filterwarnings = [
    "ignore:Support for class-based `config` is deprecated:DeprecationWarning",
    "ignore:'crypt' is deprecated:DeprecationWarning",
    "ignore:`json_encoders` is deprecated:DeprecationWarning",
    "ignore:The default datetime adapter is deprecated:DeprecationWarning"
]

[tool.pyright]
extraPaths = ["."]
